function comparisonPanel(){const question=q(state.crossQ);const keys=groups[state.dim];const topic=question.rows.find(v=>v.id===state.topic)||question.rows[0];const maxKey=[...keys].sort((a,b)=>topic.values[b]-topic.values[a])[0];const minKey=[...keys].sort((a,b)=>topic.values[a]-topic.values[b])[0];const gap=100*(topic.values[maxKey]-topic.values[minKey]);

a'}</th><th>Total<small>n = ${question.n.total}</small></th>${keys.map(k=>`<th>${labels[k]}<small>n = ${question.n[k]}</small></th>`).join('')}</tr></thead><tbody>${question.rows.map(row=>`<tr><td><button data-select-topic="${row.id}">${row.label}</button></td>${['total',...keys].map(k=>`<td class="heat" style="background:rgba(110,189,151,${Math.min(.6,row.values[k]*1.05).toFixed(3)})">${pct(row.values[k],1)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="caption">${baseNote(question)} Los casos sin dato de edad o género permanecen en el total, por lo que las bases de esos segmentos pueden sumar menos.</p>`;
}

function territory(){const selected=mapPoints.find(p=>p[0]===state.mapSelected);return intro('Distintas escalas de lectura','El territorio necesita contexto.','La encuesta comunal, la visita a terreno y los antecedentes de otros proyectos aportan capas diferentes. Aquí puedes examinarlas sin mezclar sus universos.')+`<div class="cols wide"><section class="card pad"><div class="cardhead"><div><h2>Mapa de referencia</h2><p>Selecciona un hito para conocer su alcance.</p></div><span class="pill">Esquema anonimizado</span></div><div class="maptools"><button class="btn" data-action="map-outline" aria-pressed="${state.mapOutline}">Perímetro</button><button class="btn" data-action="map-pins" aria-pressed="${state.mapPins}">Instalaciones y proyectos</button></div>${mapSVG()}<div class="legend"><span class="key"><i class="outline"></i>Perímetro aportado</span><span class="key"><i></i>Hitos del contexto</span></div><div class="map-list">${mapPoints.slice(0,4).map(p=>`<button data-map-point="${p[0]}" class="${state.mapSelected===p[0]?'active':''}">${p[3]}</button>`).join('')}</div><div class="map-detail"><h3>${selected[3]}</h3><p>${pointCopy[selected[0]]||'Hito visible en la imagen del entorno. La base de encuestas no permite asignar respuestas, frecuencias o grados de exposición a esta ubicación.'}</p></div></section><div class="layers"><article class="card layer"><div class="eyebrow">01 · Encuesta comunal</div><strong>431 personas · dos canales remotos</strong><p>Residentes mayores de 18 años. Cobertura a escala comunal y segmentación por cercanía industrial declarada.</p><span class="pill green">Base cuantitativa</span><div class="source">Informe pp. 3, 5, 10 · BBDD</div></article><article class="card layer"><div class="eyebrow">02 · Visita territorial</div><strong>Una jornada documentada</strong><p>La presentación describe conversaciones abiertas y observaciones sobre polvo, inundación, saneamiento, recolección de residuos y presencia de representantes.</p><span class="pill amber">Observación cualitativa</span><div class="source">Consultoría lámina 9 · 14 junio 2025</div></article><article class="card layer"><div class="eyebrow">03 · Participación ciudadana</div><strong>Cuatro proyectos revisados</strong><p>La consultoría identifica asuntos recurrentes de agua, urbanización industrial, fiscalización, vialidad y cercanía de instalaciones a viviendas.</p><span class="pill amber">Síntesis documental</span><div class="source">Consultoría lámina 10</div></article></div></div><div class="note">La base carece de direcciones, coordenadas y zonas por respuesta. Por eso este mapa <strong>no representa distribución de encuestas, intensidad de malestar ni exposición ambiental medida</strong>. La cercanía industrial es una declaración de cada participante.</div><div class="section-title"><h2>Qué conecta estas capas</h2></div><div class="card pad"><p>La presentación de la consultoría distingue prioridades comunales de seguridad y áreas verdes, asuntos de agua y aire en el entorno del proyecto, y necesidades sanitarias y viales en un sector local. Esa lectura orienta dónde profundizar el trabajo, sin convertir observaciones de terreno en porcentajes de la encuesta.</p><div class="source">Consultoría lámina 21 · Referencias locales anonimizadas.</div></div>`}

{id:'A-06',title:'Plan de comunicación',desc:'Organizar una devolución y un seguimiento editorial vinculados con temas observados.',format:'Programa trimestral propuesto',evidence:'P2 · P4 · Consultoría',conditions:'Validar canales y frecuencia. Las preferencias de canal no se preguntaron.'}

function outputsView(){return intro('De la evidencia al trabajo','Entregables que puedes utilizar.','Seis formatos de la maqueta original, reconstruidos con los resultados de la investigación. Abre un borrador, revisa su fundamento y descárgalo.')+`<div class="note neutral" style="margin-bottom:20px">Los resultados son observados; las acciones, calendarios y roles son propuestas para revisión. Los borradores no atribuyen medidas ejecutadas, responsables confirmados ni compromisos aprobados.</div><div class="deliver-grid">${outputs.map((o,i)=>`<article class="card deliver"><div class="fileicon">${icon('outputs')}</div><span class="meta" style="margin-top:12px;margin-bottom:0">${o.id} · ${o.format}</span><h3>${o.title}</h3><p>${o.desc}</p><span class="pill green">${o.evidence}</span><div class="meta" style="margin-top:14px">${o.conditions}</div><button class="btn" data-output="${i}">Abrir borrador ${icon('arrow')}</button></article>`).join('')}</div>`}
function outputText(i){const header='TITANIA PULSE\nCaso anonimizado · Comuna Delta\nBORRADOR PARA REVISIÓN\nCifras observadas; acciones propuestas.\n\n';const stats=`El estudio reúne 431 encuestas: 221 telefónicas y 210 en línea, realizadas en mayo–junio de 2025. Las preguntas sobre mejoras, futuro y rol empresarial tienen 424, 423 y 408 respuestas procesables, respectivamente. Los porcentajes son ponderados por género y edad; cada persona puede mencionar varias ideas.`;const foot='\n\nFUENTES\nBase del estudio, hoja Tablas; informe Merlin, junio 2025. Las referencias de la comuna y de las organizaciones están anonimizadas. Propuestas sujetas a validación. La encuesta no midió confianza, reputación de una empresa individual ni preferencia de canales.';
const texts=[
`DEVOLUCIÓN A LA COMUNIDAD\n\nCompartimos los principales resultados de una investigación sobre lo que las personas esperan para su comuna. Participaron 431 residentes por teléfono y en línea.\n\nAl preguntar qué debería mejorar, ${val('q2','Mejorar la seguridad')} mencionó la seguridad, ${val('q2','Mejorar calles y veredas')} las calles y veredas y ${val('q2','Más plazas / áreas verdes')} las plazas y áreas verdes. Cuando se preguntó por el aporte de las empresas que generan contaminación o residuos, ${val('q4','Menos contaminación')} pidió menos contaminación.\n\nEstas respuestas abren temas que merecen ser conversados con mayor profundidad. Proponemos una instancia de devolución que permita contrastar esta lectura con experiencias locales y definir qué asuntos requieren seguimiento.\n\nAntes de difundir este mensaje, corresponde confirmar quién convoca, la fecha y el canal de contacto. El estudio no acredita medidas correctivas ya ejecutadas ni permite atribuir impactos a una empresa particular.`,
`INFORME EJECUTIVO\n\nALCANCE\n${stats}\n\nPRINCIPALES RESULTADOS\n• ${val('q1','Sí')} declara vivir cerca de zonas industriales.\n• Seguridad encabeza las mejoras actuales (${val('q2','Mejorar la seguridad')}) y las expectativas de futuro (${val('q3','Mejorar la seguridad')}).\n• Menos contaminación es la primera respuesta sobre el rol empresarial (${val('q4','Menos contaminación')}).\n• Áreas verdes en mejoras actuales: ${val('q2','Más plazas / áreas verdes','near',1)} entre quienes declaran cercanía industrial y ${val('q2','Más plazas / áreas verdes','far',1)} entre quienes no.\n\nLECTURA\nLa agenda cotidiana y las expectativas sobre la responsabilidad ambiental requieren conversaciones específicas. La pregunta empresarial induce un marco ambiental y no equivale a una evaluación de reputación.\n\nDECISIONES PROPUESTAS\n1. Priorizar una devolución del estudio y una escucha focalizada sobre áreas verdes y desempeño ambiental.\n2. Verificar qué información operacional puede compartirse y con qué frecuencia.\n3. Diseñar el siguiente levantamiento con variables territoriales y preguntas de confianza, si esas dimensiones se quieren medir.\n\nLÍMITES\nMedición única, sin localización individual ni indicador de confianza. Las diferencias son descriptivas.`,
`PLAN DE RELACIONAMIENTO · 90 DÍAS PROPUESTOS\n\nOBJETIVO\nContrastar las prioridades del estudio y acordar un proceso de relación con seguimiento verificable.\n\nDÍAS 1–30 · DEVOLUCIÓN Y VALIDACIÓN\nEntregar una síntesis del estudio; identificar actores mediante trabajo de campo; confirmar sectores relevantes y profundizar en seguridad, áreas verdes y expectativas ambientales. Rol sugerido: relaciones comunitarias con apoyo de investigación. Entregable: registro de devolución, mapa de actores verificado y preguntas pendientes.\n\nDÍAS 31–60 · DISEÑO\nDistinguir demandas generales de asuntos sobre los que la organización tiene atribuciones; evaluar opciones de información, diálogo y colaboración. Rol sugerido: comunidades y operaciones. Entregable: matriz de propuestas con factibilidad y responsable por confirmar.\n\nDÍAS 61–90 · ACUERDOS Y SEGUIMIENTO\nPresentar alternativas, documentar acuerdos alcanzados y definir evidencias y plazos. Entregable: registro de compromisos efectivamente validados.\n\nINDICADORES PROPUESTOS\nCobertura de interlocutores previamente identificados, respuestas entregadas a consultas registradas y avance de compromisos acordados. Línea de base, metas y presupuesto por definir. No se presupone la existencia de dirigentes ya contactados.\n\nFUNDAMENTO\n${val('q2','Más plazas / áreas verdes')} menciona áreas verdes como mejora comunal (P2, n = 424). ${val('q4','Menos contaminación')} pide menos contaminación a las empresas (P4, n = 408). La consultoría recomienda diálogo sostenido y mayor transparencia (lámina 12).`,
`PROTOCOLO PRELIMINAR ANTE REPORTES DE OLORES\n\nFUNDAMENTO\nExisten referencias cualitativas a olores y asuntos ambientales en ejemplos del informe y en la consultoría. El estudio no cuantifica la prevalencia de olores ni acredita episodios operacionales específicos.\n\n1. RECEPCIÓN\nRegistrar fecha, lugar indicado, descripción, duración percibida y canal de respuesta consentido. Evitar solicitar datos personales innecesarios.\n\n2. VERIFICACIÓN\nContrastar el reporte con registros operacionales, condiciones locales y antecedentes técnicos disponibles. Registrar qué se pudo verificar y qué permanece incierto.\n\n3. EVALUACIÓN\nAplicar los criterios técnicos y procedimientos vigentes de la organización. El equipo competente debe definir umbrales, responsables y tiempos de respuesta antes de adoptar este borrador.\n\n4. RESPUESTA\nInformar lo conocido, las verificaciones pendientes y el próximo punto de actualización. Toda mención a medidas debe corresponder a acciones confirmadas.\n\n5. CIERRE Y APRENDIZAJE\nRegistrar respuesta, evidencia y seguimiento acordado. Analizar recurrencia solo cuando exista una serie de reportes comparable.\n\nROLES SUGERIDOS\nComunidades: recepción y respuesta. Operaciones: verificación. Comunicaciones y equipo especializado: revisión de información. Todos por designar.`,
`AGENDA DE VISITA · JORNADA PROPUESTA\n\nOBJETIVO\nProfundizar la lectura local del estudio sin atribuirle representatividad a conversaciones exploratorias.\n\nAPERTURA\nRevisar mapa de referencia, antecedentes y preguntas pendientes. Confirmar acceso, consentimiento y criterios de registro.\n\nRECORRIDO\nObservar condiciones de vialidad, saneamiento y espacios públicos. Distinguir observación directa de relato recibido. Registrar ubicaciones únicamente con un método y resguardos definidos.\n\nCONVERSACIONES\nPreguntar por experiencias cotidianas, lugares relevantes, expectativas empresariales y canales preferidos. Seleccionar perfiles diversos sin presuponer actores ya identificados.\n\nCONTRASTE\nExplorar por qué las áreas verdes aparecen con mayor frecuencia entre quienes declaran cercanía industrial (${val('q2','Más plazas / áreas verdes','near')} frente a ${val('q2','Más plazas / áreas verdes','far')}, P2).\n\nCIERRE\nSeparar hallazgos, hipótesis y asuntos pendientes. Entregar un registro con fuentes, límites y próximos pasos.\n\nMATERIALES\nGuía de conversación, ficha de observación, mapa y protocolo de consentimiento. Equipo, itinerario y participantes por confirmar.`,
`PLAN DE COMUNICACIÓN · TRIMESTRE PROPUESTO\n\nMES 1 · DEVOLUCIÓN\nExplicar qué se preguntó, a quiénes y cuáles son los principales resultados. Publicar una síntesis comprensible que preserve las bases de cada pregunta.\n\nMES 2 · PROFUNDIZACIÓN\nAbrir una conversación sobre prioridades comunales y expectativas ambientales. Confirmar canales de contacto mediante consulta directa; el estudio no preguntó por preferencias de WhatsApp, reuniones u otros canales.\n\nMES 3 · SEGUIMIENTO\nComunicar respuestas entregadas y avances de los compromisos que efectivamente se hayan acordado. Diferenciar acciones realizadas de propuestas en evaluación.\n\nMENSAJES DE PARTIDA\n• Seguridad como mejora comunal: ${val('q2','Mejorar la seguridad')} (P2, n = 424).\n• Áreas verdes como mejora: ${val('q2','Más plazas / áreas verdes')} (P2, n = 424).\n• Menos contaminación como aporte empresarial: ${val('q4','Menos contaminación')} (P4, n = 408).\n\nMEDICIÓN PROPUESTA\nRegistrar recepción de consultas, respuestas, asistencia cuando corresponda y alcance verificable. Para medir cambio de confianza se requiere una nueva pregunta y mediciones comparables. Frecuencia, roles y metas por definir.`
];return header+texts[i]+foot;}
function method(){return intro('Alcance y trazabilidad','Qué mide este estudio.','La plataforma sigue las tablas y el informe de la investigación. La presentación de consultoría añade contexto cualitativo y orientaciones de trabajo.')+`<div class="cols"><section class="card pad"><h2>Diseño de la investigación</h2><div class="mini-stat"><div><b>431</b><p class="meta">Encuestas en la base</p></div><span class="pill">Mayo–junio 2025</span></div><div class="methodrow">${icon('phone')}<div><b>Llamadas telefónicas automatizadas</b><div class="meta">12–23 mayo · 2:48 media · 89% completitud</div></div><strong>221</strong></div><div class="methodrow">${icon('screen')}<div><b>Encuesta en línea difundida en Instagram</b><div class="meta">11–17 junio · 3:56 media · 98% completitud</div></div><strong>210</strong></div><div class="source">Informe pp. 5, 8, 10. Duración y completitud según informe; recuentos verificados en BBDD.</div></section><section class="card pad"><h2>Cómo leer las cifras</h2><ul class="audit-list"><li>Porcentajes ponderados por género y edad, según las tablas del estudio y su referencia al Censo 2024.</li><li>Las bases n corresponden al número de respuestas procesables, sin ponderar.</li><li>Una respuesta abierta puede contener varias ideas. Las categorías se superponen.</li><li>El resumen redondea al entero; la exploración muestra un decimal. Los cálculos usan la precisión de las tablas.</li><li>La base entregada carece de pesos individuales y codificación semántica por persona. Los cruces ponderados se toman directamente de la hoja Tablas.</li></ul></section></div>
<section class="card pad"><h2>El cuestionario</h2><p class="caption">Se conserva la formulación y se sustituye el nombre de la comuna. El inicio solicitaba consentimiento y señalaba confidencialidad.</p>${D.questions.map(v=>`<div class="qa"><b>${v.id.toUpperCase().replace('Q','P')}</b> · ${v.text}<div class="meta">${v.kind} · ${v.n.total} respuestas procesables</div></div>`).join('')}<div class="qa"><b>P5</b> · ¿Cuál es su sexo?<div class="meta">El cuestionario del informe la identifica como exclusiva de la encuesta en línea. BBDD incluye género en ambos canales; el método de asignación telefónica no está descrito.</div></div><div class="qa"><b>P6</b> · ¿Cuál es su año de nacimiento?</div><div class="qa"><b>P7</b> · ¿Cuál es su ocupación o cargo actual?</div><div class="source">Informe p. 8. No se formularon preguntas de confianza, evaluación de una empresa individual o preferencias de canal.</div></section>
<div class="sample-grid"><section class="card"><h3>Género en BBDD</h3>${[['Femenino',244],['Masculino',182],['Sin información',5]].map(a=>`<div class="profileline"><span>${a[0]}</span><b>${a[1]}</b></div>`).join('')}<p class="caption">Conteos sin ponderar.</p></section><section class="card"><h3>Edad en BBDD</h3>${[['18–35 años',75],['36–54 años',163],['55 años y más',185],['Sin información',8]].map(a=>`<div class="profileline"><span>${a[0]}</span><b>${a[1]}</b></div>`).join('')}</section><section class="card"><h3>Cercanía en BBDD</h3>${[['Sí',225],['No',206]].map(a=>`<div class="profileline"><span>${a[0]}</span><b>${a[1]}</b></div>`).join('')}<p class="caption">225 de 431 es 52,2% sin ponderar. La tabla ponderada publica 54,3%.</p></section></div>
<section class="card pad" style="margin-top:22px"><h2>Fuentes y decisiones de lectura</h2><details class="qa" open><summary>Qué se conserva y qué se anonimiza</summary><p>Se conservan tamaños muestrales, porcentajes, categorías y cruces publicados. Se sustituyen nombres de comuna, empresas, proyectos y lugares. El explorador incorpora las 1.255 respuestas abiertas con nombres, lugares, edades y firmas sustituidos entre corchetes. Se omiten identificadores originales, ocupaciones, fechas individuales y vínculos entre respuestas de la misma persona. La maqueta no incluye audios de participantes. Las nubes, grafos y keywords son exploraciones textuales adicionales, con reglas explícitas y conteos sin ponderar.</p></details><details class="qa"><summary>Diferencias resueltas entre fuentes</summary><ul><li>Cercanía industrial: 54,3% Sí y 45,7% No en Tablas. La presentación de consultoría invierte esa lectura; se prioriza la tabla y el gráfico del informe p. 13.</li><li>Mejoras y sueños son preguntas diferentes: seguridad 45,5% en P2 y 41,8% en P3; áreas verdes 23,5% y 16,9%, respectivamente.</li><li>Las tablas contienen 28 categorías para P2, 28 para P3 y 16 para P4. Se muestran las categorías documentadas, aunque el pie de algunas láminas de P4 mencione 28.</li><li>«Invertir en tecnología para mitigar contaminantes» en P4 equivale a 10,7%; su redondeo al entero es 11%.</li></ul></details><details class="qa"><summary>Alcance de los contrastes</summary><p>Solo se ofrecen los cruces publicados por género, edad y cercanía industrial. La base individual no incluye los pesos ni las asignaciones de marcadores para construir cruces combinados equivalentes. Los casos sin dato pueden formar parte del total sin aparecer en los segmentos. Las diferencias de porcentajes se presentan como descriptivas.</p></details><details class="qa"><summary>Error muestral informado</summary><p>El informe declara 4,7% para la muestra total y otros valores por pregunta y segmento. La documentación describe captación telefónica y digital, pero no detalla un diseño probabilístico completo que permita verificar ese margen de error. Por eso no se presenta como garantía de representatividad ni como intervalo calculado por la plataforma.</p></details><details class="qa"><summary>Mapa y cobertura</summary><p>El mapa aportado es una imagen con un perímetro e hitos de proyectos e instalaciones. Su reconstrucción conserva posiciones relativas de referencia y anonimiza rótulos. No contiene coordenadas verificadas ni polígonos oficiales. La base de 431 encuestas no permite localizar respuestas individuales ni calcular resultados por sector.</p></details><details class="qa"><summary>Entregables y consultas</summary><p>Los seis formatos de entrega conservan la arquitectura del HTML original. Sus borradores se apoyan en cifras y antecedentes documentados; cada acción propuesta requiere validación. La consulta del estudio es un buscador guiado local de estos contenidos y no una conexión a un modelo de IA ni un sistema de captura activa.</p></details></section>`}
function render(){const views={overview,questions,cross,findings:findingsView,territory,outputs:outputsView,method};$('nav').innerHTML=navs.map(([id,label])=>`<button data-go="${id}" class="${state.view===id?'active':''}" ${state.view===id?'aria-current="page"':''}>${icon(id)}${label}</button>`).join('');$('crumb').textContent=navs.find(v=>v[0]===state.view)?.[1]||'Fuentes y metodología';$('view').innerHTML=views[state.view]();$('menu').innerHTML=icon('menu');}
function go(id){state.view=id;render();$('sidebar').classList.remove('open');$('menu').setAttribute('aria-expanded','false');window.scrollTo({top:0,behavior:'instant'});history.replaceState(null,'','#'+id)}
function showDialog(title,body,foot=''){lastFocus=document.activeElement;$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;$('dialog-foot').innerHTML=foot;$('dialog-foot').hidden=!foot;$('dialog').showModal();}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,2800)}
function evidence(id){const question=D.questions.find(v=>v.rows.some(r=>r.id===id));const row=question.rows.find(r=>r.id===id);const key=state.view==='questions'?state.segment:'total';showDialog(row.label,`<div class="eyebrow">${question.id.toUpperCase().replace('Q','P')} · ${question.short}</div><h3>${question.text}</h3><div style="font-size:46px;letter-spacing:-.04em;margin:20px 0;color:var(--dark)">${pct(row.values[key],1)}</div><p>${labels[key]} · ${question.n[key]} respuestas procesables.</p><div class="note neutral" style="margin-top:20px">${baseNote(question)}</div><div class="source">${question.id==='q1'?`Hoja Tablas, C12:D17. Columna C = No; D = Sí. Filas 12–17 = total, femenino, masculino, 18–35, 36–54, 55 y más.`:`Hoja Tablas, fila ${row.row}. Columnas C–J = total, femenino, masculino, 18–35, 36–54, 55 y más, no cerca, sí cerca.`}<br>Informe pp. ${question.pages.join(', ')}.</div>`,`<button class="btn primary" data-evidence-cross="${question.id}|${row.id}">Comparar segmentos ${icon('arrow')}</button>`)}
function download(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function csv(crossing=false){const question=q(crossing?state.crossQ:state.q);const keys=crossing?['total',...groups[state.dim]]:Object.keys(question.n);const rows=[['TITANIA Pulse','Caso anonimizado','Porcentajes ponderados'],['Pregunta',question.id.toUpperCase().replace('Q','P'),question.text],['Fuente','Hoja Tablas',question.range],['Categoria',...keys.map(k=>labels[k])],['Base n',...keys.map(k=>question.n[k])],...question.rows.map(v=>[v.label,...keys.map(k=>(v.values[k]*100).toFixed(4))])];download(`TITANIA_Pulse_${question.id}_${crossing?state.dim:'tabla'}.csv`,'\uFEFF'+rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function output(i){activeOutput=outputs[i].id;activeText=outputText(i);showDialog(outputs[i].title,`<span class="pill amber">Borrador para revisión</span><div class="note neutral" style="margin-top:14px">${outputs[i].conditions}</div><pre class="output">${esc(activeText)}</pre>`,`<button class="btn" data-action="copy-output">Copiar texto</button><button class="btn primary" data-action="download-output">${icon('download')}Descargar .txt</button>`)}
function assistant(){showDialog('Consultar el estudio',`<p>Explora las preguntas, resultados y límites de esta investigación.</p><p class="meta" style="margin:8px 0 18px">Consulta guiada sobre contenidos verificados · demostración local</p><div class="assistchips">${['¿Qué se preguntó?','¿Qué piden a las empresas?','¿Qué cambia según la edad?','¿Dónde se encuestó?','¿Se midió confianza?'].map(s=>`<button data-ask="${esc(s)}">${s}</button>`).join('')}</div><form class="assistant-form" id="assist-form"><label class="sr-only" for="ask-input">Consulta</label><input id="ask-input" placeholder="Busca un tema del estudio…" maxlength="300"><button class="btn primary" type="submit">Consultar</button></form><div id="assist-answer" aria-live="polite"></div>`)}
function answer(text){let s=text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let response='';
if(/confianz|reputacion|nps/.test(s))response='La encuesta no midió confianza ni reputación de una empresa individual. Recogió cercanía industrial, mejoras comunales, expectativas de futuro y expectativas hacia las empresas. La consultoría aporta una lectura cualitativa de desconfianza, sin una frecuencia cuantificada.\nFuente: cuestionario, informe p. 8; consultoría láminas 10–11.';
else if(/donde|mapa|zona|ubicacion/.test(s))response='El levantamiento se dirigió a residentes mayores de 18 años de la comuna, mediante 221 encuestas telefónicas y 210 en línea. La base no incluye dirección, coordenadas ni sector de residencia. El mapa muestra contexto de instalaciones y proyectos, no distribución de las 431 respuestas.\nFuente: informe pp. 3, 5 y 10; columnas de BBDD; imagen territorial.';
else if(/edad|joven|generacion/.test(s))response=`En P4, «más ecológico» aparece en ${val('q4','Más ecológico','young',1)} del grupo de 18–35 años (n = 67), ${val('q4','Más ecológico','middle',1)} del grupo de 36–54 (n = 156) y ${val('q4','Más ecológico','older',1)} del grupo de 55 y más (n = 180). Son diferencias descriptivas de porcentajes ponderados.\nFuente: Tablas F113:H113; bases F128:H128; informe p. 26.`;
else if(/empresa|contamin/.test(s))response=`Al preguntar por el aporte de las empresas que generan contaminación o residuos (P4), ${val('q4','Menos contaminación','total',1)} menciona menos contaminación, ${val('q4','Más ecológico','total',1)} ser más ecológicas y ${val('q4','Más plazas / áreas verdes','total',1)} más áreas verdes. Base: 408 respuestas. No es una pregunta de evaluación de una empresa particular.\nFuente: Tablas C112:C114; informe p. 25.`;
else if(/pregunt|cuestionario/.test(s))response=D.questions.map(v=>`${v.id.toUpperCase().replace('Q','P')}. ${v.text} (n = ${v.n.total})`).join('\n\n')+'\n\nAdemás se recogieron sexo en el cuestionario en línea, año de nacimiento y ocupación. Fuente: informe p. 8.';
else if(/verde|plaza/.test(s))response=`En mejoras comunales (P2), las áreas verdes aparecen en ${val('q2','Más plazas / áreas verdes','near',1)} de quienes declaran cercanía industrial (n = 220), frente a ${val('q2','Más plazas / áreas verdes','far',1)} de quienes no (n = 204). La encuesta no midió acceso físico a plazas ni distancia a industrias.\nFuente: Tablas I44:J44 y I70:J70; informe p. 17.`;
else if(/seguridad|mejora|sueno|futuro/.test(s))response=`Mejorar la seguridad es la primera mención en mejoras actuales (${val('q2','Mejorar la seguridad','total',1)}, n = 424) y expectativas de futuro (${val('q3','Mejorar la seguridad','total',1)}, n = 423). Son dos preguntas distintas.\nFuente: Tablas C42 y C77; informe pp. 15 y 20.`;
else if(/canal|telefono|voz|texto|tiempo|duracion|muestra|cuant/.test(s))response='El estudio reúne 431 encuestas: 221 telefónicas y 210 en línea difundidas en Instagram. Duración media informada: 2:48 y 3:56, respectivamente. El archivo recibido incluye respuestas transcritas y escritas, no audios reproducibles. El estudio no mide preferencias de canal.\nFuente: BBDD; informe pp. 5, 8 y 10.';
else if(/costo|precio|ahorro/.test(s))response='Las fuentes no contienen un costo por encuesta ni una comparación económica contra otros métodos. Permiten mostrar volumen, duración y resultados, pero no cuantificar ahorro o afirmar una ventaja de precio.';
else {const tokens=s.split(/\W+/).filter(t=>t.length>3);const matches=D.questions.flatMap(question=>question.rows.filter(row=>tokens.some(t=>row.label.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(t))).map(row=>`${question.id.toUpperCase().replace('Q','P')} · ${row.label}: ${pct(row.values.total,1)}, n = ${question.n.total}. Fuente: Tablas fila ${row.row}.`));response=matches.length?matches.slice(0,6).join('\n\n'):'La consulta guiada no encuentra una respuesta directa en los contenidos disponibles. Puedes explorar el cuestionario, las categorías semánticas o los cruces. Esta demo no genera hechos fuera del estudio.';}
$('assist-answer').innerHTML=`<div class="answer">${esc(response)}</div>`;}
document.addEventListener('click',event=>{const e=event.target.closest('button,[data-map-point]');if(!e)return;
if(e.dataset.go){if($('dialog').open)$('dialog').close();go(e.dataset.go)}
else if(e.dataset.question){state.q=e.dataset.question;state.segment='total';state.search='';state.all=false;render()}
else if(e.dataset.openQ){ex.panel='results';state.q=e.dataset.openQ;state.segment='total';state.search='';state.all=false;go('questions')}
else if(e.dataset.crossQ){state.crossQ=e.dataset.crossQ;ct.search='';ct.sort='source';if(state.crossQ==='q1'&&ct.dimension==='near')ct.dimension='all';if(state.crossQ==='q1'&&state.dim==='near')state.dim='age';state.topic=q(state.crossQ).rows[0].id;render()}
else if(e.dataset.deepCross){ct.view='chart';[state.crossQ,state.dim,state.topic]=e.dataset.deepCross.split('|');go('cross')}
else if(e.dataset.selectTopic){state.topic=e.dataset.selectTopic;render();window.scrollTo({top:0,behavior:'smooth'})}
else if(e.dataset.evidence){evidence(e.dataset.evidence)}
else if(e.dataset.evidenceCross){ct.view='chart';[state.crossQ,state.topic]=e.dataset.evidenceCross.split('|');state.dim=state.crossQ==='q1'?'age':'near';$('dialog').close();go('cross')}
else if(e.dataset.finding!==undefined){const i=Number(e.dataset.finding);if(i===1){ex.panel='results';state.q='q4';state.segment='total';go('questions')}else{go('findings')}}
else if(e.dataset.output!==undefined){output(Number(e.dataset.output))}
else if(e.dataset.mapPoint){state.mapSelected=e.dataset.mapPoint;render()}
else if(e.dataset.ask){$('ask-input').value=e.dataset.ask;answer(e.dataset.ask)}
else if(e.id==='menu'){const open=$('sidebar').classList.toggle('open');$('menu').setAttribute('aria-expanded',String(open))}
else {switch(e.dataset.action){case 'close':$('dialog').close();break;case 'assistant':assistant();break;case 'wording':go('method');break;case 'toggle-all':state.all=!state.all;render();break;case 'csv':csv();break;case 'cross-csv':csv(true);break;case 'map-outline':state.mapOutline=!state.mapOutline;render();break;case 'map-pins':state.mapPins=!state.mapPins;render();break;case 'download-output':download(`TITANIA_Pulse_${activeOutput}.txt`,activeText);break;case 'copy-output':navigator.clipboard?.writeText(activeText).then(()=>toast('Texto copiado.')).catch(()=>toast('Utiliza Descargar .txt para guardar el borrador.'));break;}}
});
document.addEventListener('change',e=>{switch(e.target.id){case 'segment':state.segment=e.target.value;render();break;case 'cross-dim':state.dim=e.target.value;render();break;case 'cross-topic':state.topic=e.target.value;render();break;}});
document.addEventListener('input',e=>{if(e.target.id==='topic-search'){const pos=e.target.selectionStart;state.search=e.target.value;render();$('topic-search').focus();try{$('topic-search').setSelectionRange(pos,pos)}catch{}}});
document.addEventListener('submit',e=>{if(e.target.id==='assist-form'){e.preventDefault();answer($('ask-input').value)}});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-map-point]')&&['Enter',' '].includes(e.key)){e.preventDefault();state.mapSelected=e.target.dataset.mapPoint;render()}});
$('dialog').addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus()});
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const b=$('dialog').getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)$('dialog').close()}});

render();
window.parent?.postMessage("titania-pulse-ready", "*");
</script>
